<style>body{margin:0;background:#0a0d0b;color:#eef3ef;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;padding:calc(30px + env(safe-area-inset-top)) 22px 30px;line-height:1.6}
h2{margin:0 0 10px}b{color:#22c55e}.btn{display:block;text-align:center;background:#22c55e;color:#04210f;font-weight:800;font-size:17px;padding:15px;border-radius:14px;margin-top:14px;text-decoration:none;border:0;width:100%;box-sizing:border-box}
.ghost{background:#1c241f;color:#eef3ef}.box{background:#141a16;border:1px solid #26302a;border-radius:16px;padding:16px;margin-top:14px}</style></head>
<body><div id="v"></div>
<script>
var n=0;try{var r=JSON.parse(localStorage.getItem('jr_runs')||'[]');n=r.length}catch(e){}
var v=document.getElementById('v');
if(!n){location.replace('index2.html')}
else{v.innerHTML='<h2>Just Run이 새 주소로 옮겨졌어요</h2><div>이 아이콘에 달리기 기록 <b>'+n+'개</b>가 남아 있어요. 아래 순서대로 새 앱으로 옮겨 주세요.</div>'+
 '<div class="box">1. <b>백업 파일 저장</b>을 누르고 \'파일에 저장\'을 고르세요.<br>2. <b>새 앱 열기</b>를 누르고, 새 앱에서 더보기 → 백업 → 백업 가져오기로 그 파일을 고르세요.<br>3. 새 앱에서 공유 → 홈 화면에 추가를 하고, 확인이 끝나면 이 아이콘은 지워도 돼요.</div>'+
 '<button class="btn" id="ex">백업 파일 저장</button><a class="btn ghost" href="index2.html">새 앱 열기</a>';
 document.getElementById('ex').onclick=async function(){var d={app:'justrun',v:1};['settings','workouts','plan','courses','runs','shoes','cal','races'].forEach(function(k){try{var x=localStorage.getItem('jr_'+k);if(x)d[k]=JSON.parse(x)}catch(e){}});
  var s=JSON.stringify(d),f=new File([s],'justrun-backup-old.json',{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}
  var a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove()}}
</script></body></html>
